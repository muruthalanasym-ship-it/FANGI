  <rect width="900" height="220" rx="8" fill="url(#planks)"/>
  <rect x="12" y="12" width="876" height="196" rx="28" fill="none" stroke="#24243b" stroke-width="3"/>
  <path d="M29 51v118q0 17 17 17h808q17 0 17-17V51" fill="none" stroke="#24243b" stroke-width="2" opacity=".8"/>
