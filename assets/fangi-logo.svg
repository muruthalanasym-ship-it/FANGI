      <path d="M8 0v220M103 0v220" stroke="#aaa8a3" stroke-opacity=".42"/>
      <path d="M19 0c-4 38 5 66 0 101s4 73 0 119M81 0c5 47-5 75 1 114s-3 72 1 106" fill="none" stroke="#fff" stroke-opacity=".35"/>
      <path d="M44 0c3 42-3 74 1 112s-2 68 2 108" fill="none" stroke="#aaa8a3" stroke-opacity=".2"/>
    </pattern>
