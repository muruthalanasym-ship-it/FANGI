      <stop offset="0" stop-color="#d6d4d0"/>
      <stop offset=".5" stop-color="#f3f1ed"/>
      <stop offset="1" stop-color="#d2d0cb"/>
    </linearGradient>
    <pattern id="planks" width="110" height="220" patternUnits="userSpaceOnUse">
