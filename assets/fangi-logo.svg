<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-labelledby="title desc">
<title id="title">FANGI wooden wordmark</title><desc id="desc">FANGI lettering in a warm carved wood style with natural grain.</desc>
<defs>
<linearGradient id="timber" x1="0" y1="0" x2="0.12" y2="1"><stop offset="0" stop-color="#d9ad7b"/><stop offset=".28" stop-color="#b77b4c"/><stop offset=".62" stop-color="#89532f"/><stop offset="1" stop-color="#59351f"/></linearGradient>
<pattern id="grain" width="48" height="22" patternUnits="userSpaceOnUse"><path d="M-4 6 C8 0 18 12 31 5 S48 4 55 8 M-6 17 C7 11 18 22 32 15 S48 14 56 18" fill="none" stroke="#f0c99a" stroke-opacity=".34" stroke-width="1.2"/></pattern>
<clipPath id="letters"><text x="7" y="78" font-family="Georgia,serif" font-weight="900" font-size="75" letter-spacing="2">FANGI</text></clipPath>
</defs>
<text x="7" y="78" font-family="Georgia,serif" font-weight="900" font-size="75" letter-spacing="2" fill="url(#timber)" stroke="#59351f" stroke-width="1.7" paint-order="stroke">FANGI</text>
<rect width="420" height="88" fill="url(#grain)" clip-path="url(#letters)"/>
<path d="M10 92 H390" stroke="#9a6037" stroke-width="1.5"/>
<text x="210" y="111" text-anchor="middle" fill="#543522" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="6">CARPENTRY &amp; WOODCRAFT</text>
</svg>