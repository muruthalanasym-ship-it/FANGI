  <text x="155" y="148" fill="#24243b" font-family="Arial,sans-serif" font-size="112" font-weight="400" letter-spacing="1">Fangi</text>
  <text x="166" y="184" fill="#24243b" font-family="Arial,sans-serif" font-size="23" letter-spacing="15">CARPENTRY</text>
  <text x="450" y="203" text-anchor="middle" fill="#24243b" font-family="Arial,sans-serif" font-size="12" letter-spacing="9" opacity=".8">FANGI INVESTMENT</text>
